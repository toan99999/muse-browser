# keep-alive — commit a timestamp twice a month so the repo never goes
# 60 days without activity. In a public repo GitHub auto-disables
# scheduled workflows (including the keep-warm schedule) after 60 days
# with no repository activity; a push resets that clock. This workflow
# only touches .github/last-activity.txt, which is outside the build
# trigger paths, so it never starts a build.
name: Keep repo active

on:
  schedule:
    - cron: '30 3 1,15 * *'

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update activity timestamp
        run: |
          echo "Last activity: $(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/last-activity.txt
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/last-activity.txt
          git diff --cached --quiet || git commit -m "Keep repo active [skip ci]"
          git push
